sales_gate_detail: >-
  Every tier's call to action is "Talk to sales" — there is no self-serve
  checkout on the pricing page and no published API-call or request quota. Every
  price is stated as "Starting from", so the listed figures are floors, not
  prices.
unit_of_measure:
