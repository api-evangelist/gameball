api_pricing:
  metered: false
  detail: >-
    API access is a tier FEATURE ("Standard API Access" on Growth, "Advanced API
    Access" on Enterprise), not a metered product. Gameball publishes no
    per-call price and no included call allowance. What separates standard from
    advanced API access is not documented on the pricing page. Runtime throttles
    are published separately — see rate-limits/gameball-rate-limits.yml.
free_tier:
