openapi: 3.2.0
info:
  title: Gameball Media API
tags:
- name: Media
paths:
  /api/v1/Media:
    get:
      tags:
      - Media
      summary: One page of the client's uploaded media, newest first.
      parameters:
      - name: pageNumber
        in: query
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          format: int32
          default: 24
      - name: Authorization
        in: header
        schema:
          type: string
      - name: lang
        in: header
        schema:
          type: string
      - name: APIKey
        in: header
        required: true
        schema:
          type: string
          default: 8fdfd2dffd-9mnvhu25d6c3d
      - name: SecretKey
        in: header
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_GameBall.BLL.ViewModels.Media.MediaLibraryPageViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_GameBall.BLL.ViewModels.Media.MediaLibraryPageViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_GameBall.BLL.ViewModels.Media.MediaLibraryPageViewModel'
      operationId: getApiV1Media
      x-operation-id-source: derived
    delete:
      tags:
      - Media
      summary: Deletes one media object by the relative path the listing returned.
      parameters:
      - name: path
        in: query
        schema:
          type: string
      - name: Authorization
        in: header
        schema:
          type: string
      - name: lang
        in: header
        schema:
          type: string
      - name: APIKey
        in: header
        required: true
        schema:
          type: string
          default: 8fdfd2dffd-9mnvhu25d6c3d
      - name: SecretKey
        in: header
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_System.Boolean'
            application/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_System.Boolean'
            text/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_System.Boolean'
      operationId: deleteApiV1Media
      x-operation-id-source: derived
