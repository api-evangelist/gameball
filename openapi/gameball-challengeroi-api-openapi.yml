info:
  title: Gameball Challenge ROI API
tags:
- name: ChallengeROI
paths:
  /api/v1/challenges/{challengeId}/roi:
    get:
      tags:
      - ChallengeROI
      summary: Get ROI summary for a specific challenge
      parameters:
      - name: challengeId
        in: path
        description: The challenge ID
        required: true
        schema:
          type: integer
          format: int32
      - name: Authorization
        in: header
        schema:
          type: string
      - name: lang
        in: header
        schema:
          type: string
      - name: APIKey
        in: header
        required: true
        schema:
          type: string
          default: 8fdfd2dffd-9mnvhu25d6c3d
      - name: SecretKey
        in: header
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_GameBall.BLL.ViewModels.ROI.ChallengeROISummaryViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_GameBall.BLL.ViewModels.ROI.ChallengeROISummaryViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_GameBall.BLL.ViewModels.ROI.ChallengeROISummaryViewModel'
      operationId: getApiV1ChallengesByChallengeIdRoi
      x-operation-id-source: derived
  /api/v1/challenges/{challengeId}/roi/orders:
    get:
      tags:
      - ChallengeROI
      summary: Get paginated list of attributed orders for a specific challenge
      parameters:
      - name: challengeId
        in: path
        description: The challenge ID
        required: true
        schema:
          type: integer
          format: int32
      - name: pageNo
        in: query
        description: Page number (default 1)
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        description: Page size (default 10)
        schema:
          type: integer
          format: int32
          default: 10
      - name: Authorization
        in: header
        schema:
          type: string
      - name: lang
        in: header
        schema:
          type: string
      - name: APIKey
        in: header
        required: true
        schema:
          type: string
          default: 8fdfd2dffd-9mnvhu25d6c3d
      - name: SecretKey
        in: header
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_GameBall.Common.Paging.PaginatedItemsViewModel_1_GameBall.BLL.ViewModels.ROI.ROITrackingDetailViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_GameBall.Common.Paging.PaginatedItemsViewModel_1_GameBall.BLL.ViewModels.ROI.ROITrackingDetailViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_GameBall.Common.Paging.PaginatedItemsViewModel_1_GameBall.BLL.ViewModels.ROI.ROITrackingDetailViewModel'
      operationId: getApiV1ChallengesByChallengeIdRoiOrders
      x-operation-id-source: derived
