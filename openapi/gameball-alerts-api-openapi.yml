openapi: 3.2.0
info:
  title: Gameball Alerts API
tags:
- name: Alerts
paths:
  /api/v1/Alerts:
    get:
      tags:
      - Alerts
      summary: Get a paginated list of alerts for the current client with optional severity…
      parameters:
      - name: severity
        in: query
        description: Optional severity filter (P0, P1, P2, P3)
        schema:
          $ref: '#/components/schemas/GameBall.Common.Model.Enums.EAlertSeverity'
      - name: pageNo
        in: query
        description: Page number (default 1)
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        description: Page size (default 20)
        schema:
          type: integer
          format: int32
          default: 20
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/GameBall.Common.Model.Enums.EAlertStatus'
      - name: isRead
        in: query
        schema:
          type: boolean
      - name: Authorization
        in: header
        schema:
          type: string
      - name: lang
        in: header
        schema:
          type: string
      - name: APIKey
        in: header
        required: true
        schema:
          type: string
          default: 8fdfd2dffd-9mnvhu25d6c3d
      - name: SecretKey
        in: header
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_System.Object'
            application/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_System.Object'
            text/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_System.Object'
      operationId: getApiV1Alerts
      x-operation-id-source: derived
  /api/v1/Alerts/{id}:
    get:
      tags:
      - Alerts
      summary: Get a single alert by ID
      parameters:
      - name: id
        in: path
        description: Alert ID
        required: true
        schema:
          type: integer
          format: int32
      - name: Authorization
        in: header
        schema:
          type: string
      - name: lang
        in: header
        schema:
          type: string
      - name: APIKey
        in: header
        required: true
        schema:
          type: string
          default: 8fdfd2dffd-9mnvhu25d6c3d
      - name: SecretKey
        in: header
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_GameBall.BLL.ViewModels.LoyaltyAnalyzer.AlertViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_GameBall.BLL.ViewModels.LoyaltyAnalyzer.AlertViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_GameBall.BLL.ViewModels.LoyaltyAnalyzer.AlertViewModel'
      operationId: getApiV1AlertsById
      x-operation-id-source: derived
  /api/v1/Alerts/{id}/acknowledge:
    post:
      tags:
      - Alerts
      summary: Acknowledge an alert by marking it as acknowledged
      parameters:
      - name: id
        in: path
        description: Alert ID
        required: true
        schema:
          type: integer
          format: int32
      - name: Authorization
        in: header
        schema:
          type: string
      - name: lang
        in: header
        schema:
          type: string
      - name: APIKey
        in: header
        required: true
        schema:
          type: string
          default: 8fdfd2dffd-9mnvhu25d6c3d
      - name: SecretKey
        in: header
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_System.Boolean'
            application/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_System.Boolean'
            text/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_System.Boolean'
      operationId: postApiV1AlertsByIdAcknowledge
      x-operation-id-source: derived
  /api/v1/Alerts/{id}/approve:
    post:
      tags:
      - Alerts
      summary: Approve an alert and execute its proposed action
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: Authorization
        in: header
        schema:
          type: string
      - name: lang
        in: header
        schema:
          type: string
      - name: APIKey
        in: header
        required: true
        schema:
          type: string
          default: 8fdfd2dffd-9mnvhu25d6c3d
      - name: SecretKey
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameBall.BLL.ViewModels.LoyaltyAnalyzer.AlertResolutionRequestViewModel'
          text/json:
            schema:
              $ref: '#/components/schemas/GameBall.BLL.ViewModels.LoyaltyAnalyzer.AlertResolutionRequestViewModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/GameBall.BLL.ViewModels.LoyaltyAnalyzer.AlertResolutionRequestViewModel'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_System.Boolean'
            application/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_System.Boolean'
            text/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_System.Boolean'
      operationId: postApiV1AlertsByIdApprove
      x-operation-id-source: derived
  /api/v1/Alerts/{id}/reject:
    post:
      tags:
      - Alerts
      summary: Reject an alert and record feedback
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: Authorization
        in: header
        schema:
          type: string
      - name: lang
        in: header
        schema:
          type: string
      - name: APIKey
        in: header
        required: true
        schema:
          type: string
          default: 8fdfd2dffd-9mnvhu25d6c3d
      - name: SecretKey
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameBall.BLL.ViewModels.LoyaltyAnalyzer.AlertResolutionRequestViewModel'
          text/json:
            schema:
              $ref: '#/components/schemas/GameBall.BLL.ViewModels.LoyaltyAnalyzer.AlertResolutionRequestViewModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/GameBall.BLL.ViewModels.LoyaltyAnalyzer.AlertResolutionRequestViewModel'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_System.Boolean'
            application/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_System.Boolean'
            text/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_System.Boolean'
      operationId: postApiV1AlertsByIdReject
      x-operation-id-source: derived
