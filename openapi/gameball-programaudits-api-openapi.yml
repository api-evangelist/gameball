          text/json:
            schema:
              $ref: '#/components/schemas/GameBall.BLL.ViewModels.ProgramAudit.ApproveRecommendationRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/GameBall.BLL.ViewModels.ProgramAudit.ApproveRecommendationRequest'
      responses:
