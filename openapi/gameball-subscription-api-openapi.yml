info:
  title: Gameball Subscription API
tags:
- name: Subscription
paths:
  /api/v1/Subscription:
    get:
      tags:
      - Subscription
      summary: This service is used by Shopify to create a new client
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      - name: lang
        in: header
        schema:
          type: string
      - name: APIKey
        in: header
        required: true
        schema:
          type: string
          default: 8fdfd2dffd-9mnvhu25d6c3d
      - name: SecretKey
        in: header
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_GameBall.Admin.BLL.ViewModels.ClientSubscriptionViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_GameBall.Admin.BLL.ViewModels.ClientSubscriptionViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_GameBall.Admin.BLL.ViewModels.ClientSubscriptionViewModel'
      operationId: getApiV1Subscription
      x-operation-id-source: derived
  /api/v1/Subscription/change/plan:
    put:
      tags:
      - Subscription
      parameters:
      - name: pricingPlanId
        in: query
        schema:
