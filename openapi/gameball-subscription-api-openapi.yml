        in: query
        schema:
          type: string
      - name: Authorization
        in: header
        schema:
          type: string
      - name: lang
        in: header
        schema:
          type: string
      - name: APIKey
        in: header
        required: true
        schema:
          type: string
          default: 8fdfd2dffd-9mnvhu25d6c3d
      - name: SecretKey
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameBall.Admin.BLL.ViewModels.DowngradeMetadata'
          text/json:
            schema:
              $ref: '#/components/schemas/GameBall.Admin.BLL.ViewModels.DowngradeMetadata'
          application/*+json:
            schema:
              $ref: '#/components/schemas/GameBall.Admin.BLL.ViewModels.DowngradeMetadata'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_GameBall.BLL.ViewModels.Billing.PaymentResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_GameBall.BLL.ViewModels.Billing.PaymentResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_GameBall.BLL.ViewModels.Billing.PaymentResponse'
      summary: Replace api subscription change plan
      x-summary-source: derived
      operationId: putApiV1SubscriptionChangePlan
      x-operation-id-source: derived
  /api/v1/Subscription/account:
    delete:
      tags:
      - Subscription
      parameters:
      - name: reason
        in: query
        schema:
          type: string
      - name: Authorization
        in: header
        schema:
          type: string
      - name: lang
        in: header
        schema:
          type: string
      - name: APIKey
        in: header
        required: true
        schema:
          type: string
          default: 8fdfd2dffd-9mnvhu25d6c3d
