      x-summary-source: derived
      operationId: deleteApiV1SubscriptionAccount
      x-operation-id-source: derived
  /api/v1/Subscription/shopify:
    put:
      tags:
      - Subscription
      summary: This service is used to initiate pending shopify Subscription change
      parameters:
      - name: newPricingPlanId
        in: query
        schema:
          type: integer
          format: int32
      - name: promo
        in: query
        schema:
          type: string
      - name: mac
        in: query
        schema:
          type: integer
          format: int32
      - name: Authorization
        in: header
        schema:
          type: string
      - name: lang
        in: header
        schema:
          type: string
      - name: APIKey
        in: header
        required: true
        schema:
          type: string
          default: 8fdfd2dffd-9mnvhu25d6c3d
      - name: SecretKey
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameBall.Admin.BLL.ViewModels.DowngradeMetadata'
          text/json:
            schema:
              $ref: '#/components/schemas/GameBall.Admin.BLL.ViewModels.DowngradeMetadata'
          application/*+json:
            schema:
              $ref: '#/components/schemas/GameBall.Admin.BLL.ViewModels.DowngradeMetadata'
      responses:
        '200':
          description: OK
      operationId: putApiV1SubscriptionShopify
      x-operation-id-source: derived
