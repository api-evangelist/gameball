openapi: 3.2.0
info:
  title: Gameball World Cup Admin API
tags:
- name: WorldCupAdmin
paths:
  /internal/v1/world-cup/matches/{matchCode}/result:
    post:
      tags:
      - WorldCupAdmin
      summary: Sets the official result for a match and ENQUEUES a background job that scores…
      parameters:
      - name: matchCode
        in: path
        description: The code of the match being scored.
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        schema:
          type: string
      - name: lang
        in: header
        schema:
          type: string
      - name: APIKey
        in: header
        required: true
        schema:
          type: string
          default: 8fdfd2dffd-9mnvhu25d6c3d
      - name: SecretKey
        in: header
        schema:
          type: string
      requestBody:
        description: The final per-team goals, optional penalty winner, and (knockout) the decider manner (FT/ET/PENS).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameBall.BLL.ViewModels.IntegrationsV4.WorldCup.SetMatchResultRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/GameBall.BLL.ViewModels.IntegrationsV4.WorldCup.SetMatchResultRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/GameBall.BLL.ViewModels.IntegrationsV4.WorldCup.SetMatchResultRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_System.Boolean'
            application/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_System.Boolean'
            text/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_System.Boolean'
      operationId: postInternalV1WorldCupMatchesByMatchCodeResult
      x-operation-id-source: derived
  /internal/v1/world-cup/results/ingest:
    post:
      tags:
      - WorldCupAdmin
      summary: Manually triggers the World Cup result ingestion job.
      parameters:
      - name: dryRun
        in: query
        description: When true, the job performs no writes and enqueues nothing — it only logs what it would do.
        schema:
          type: boolean
          default: false
      - name: Authorization
        in: header
        schema:
          type: string
      - name: lang
        in: header
        schema:
          type: string
      - name: APIKey
        in: header
        required: true
        schema:
          type: string
          default: 8fdfd2dffd-9mnvhu25d6c3d
      - name: SecretKey
        in: header
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_System.Boolean'
            application/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_System.Boolean'
            text/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_System.Boolean'
      operationId: postInternalV1WorldCupResultsIngest
      x-operation-id-source: derived
  /internal/v1/world-cup/fixtures/sync:
    post:
      tags:
      - WorldCupAdmin
      summary: Manually triggers the World Cup fixtures-sync job.
      parameters:
      - name: dryRun
        in: query
        description: When true, the job performs no writes — it only logs what it would add/fill.
        schema:
          type: boolean
          default: false
      - name: Authorization
        in: header
        schema:
          type: string
      - name: lang
        in: header
        schema:
          type: string
      - name: APIKey
        in: header
        required: true
        schema:
          type: string
          default: 8fdfd2dffd-9mnvhu25d6c3d
      - name: SecretKey
        in: header
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_System.Boolean'
            application/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_System.Boolean'
            text/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_System.Boolean'
      operationId: postInternalV1WorldCupFixturesSync
      x-operation-id-source: derived
  /internal/v1/world-cup/matches/refresh:
    post:
      tags:
      - WorldCupAdmin
      summary: Drops the cached World Cup fixtures so the next load re-reads them from the…
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      - name: lang
        in: header
        schema:
          type: string
      - name: APIKey
        in: header
        required: true
        schema:
          type: string
          default: 8fdfd2dffd-9mnvhu25d6c3d
      - name: SecretKey
        in: header
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_System.Boolean'
            application/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_System.Boolean'
            text/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_System.Boolean'
      operationId: postInternalV1WorldCupMatchesRefresh
      x-operation-id-source: derived
  /internal/v1/world-cup/leaderboard/reward:
    post:
      tags:
      - WorldCupAdmin
      summary: Rewards a SINGLE client's World Cup leaderboard from its configured…
      parameters:
      - name: dryRun
        in: query
        description: When true, the job performs no grants or writes — it only logs who would be rewarded with what.
        schema:
          type: boolean
          default: false
      - name: Authorization
        in: header
        schema:
          type: string
      - name: lang
        in: header
        schema:
          type: string
      - name: APIKey
        in: header
        required: true
        schema:
          type: string
          default: 8fdfd2dffd-9mnvhu25d6c3d
      - name: SecretKey
        in: header
        schema:
          type: string
      requestBody:
        description: The target client id and the World Cup challenge id to reward (both required).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameBall.BLL.ViewModels.IntegrationsV4.WorldCup.RewardLeaderboardRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/GameBall.BLL.ViewModels.IntegrationsV4.WorldCup.RewardLeaderboardRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/GameBall.BLL.ViewModels.IntegrationsV4.WorldCup.RewardLeaderboardRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_System.Boolean'
            application/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_System.Boolean'
            text/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_System.Boolean'
      operationId: postInternalV1WorldCupLeaderboardReward
      x-operation-id-source: derived
