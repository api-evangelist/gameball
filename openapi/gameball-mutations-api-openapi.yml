  /api/v1/Mutations/{id}/approve:
    post:
      tags:
      - Mutations
      summary: 'Approve and apply a mutation proposal (status: Proposed → Applied)'
      parameters:
      - name: id
        in: path
        description: Mutation ID
        required: true
        schema:
          type: integer
          format: int32
      - name: Authorization
        in: header
        schema:
          type: string
      - name: lang
        in: header
        schema:
          type: string
      - name: APIKey
        in: header
        required: true
        schema:
          type: string
          default: 8fdfd2dffd-9mnvhu25d6c3d
      - name: SecretKey
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameBall.BLL.ViewModels.LoyaltyAnalyzer.ApproveMutationRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/GameBall.BLL.ViewModels.LoyaltyAnalyzer.ApproveMutationRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/GameBall.BLL.ViewModels.LoyaltyAnalyzer.ApproveMutationRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_System.Boolean'
            application/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_System.Boolean'
            text/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_System.Boolean'
      operationId: postApiV1MutationsByIdApprove
      x-operation-id-source: derived
