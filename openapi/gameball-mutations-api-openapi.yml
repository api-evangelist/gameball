info:
  title: Gameball Mutations API
tags:
- name: Mutations
paths:
  /api/v1/Mutations:
    get:
      tags:
      - Mutations
      summary: Get all pending mutation proposals for the client
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      - name: lang
        in: header
        schema:
          type: string
      - name: APIKey
        in: header
        required: true
        schema:
          type: string
          default: 8fdfd2dffd-9mnvhu25d6c3d
      - name: SecretKey
        in: header
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_System.Collections.Generic.List_1_GameBall.BLL.ViewModels.LoyaltyAnalyzer.MutationProposalViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_System.Collections.Generic.List_1_GameBall.BLL.ViewModels.LoyaltyAnalyzer.MutationProposalViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_System.Collections.Generic.List_1_GameBall.BLL.ViewModels.LoyaltyAnalyzer.MutationProposalViewModel'
      operationId: getApiV1Mutations
      x-operation-id-source: derived
  /api/v1/Mutations/{id}:
    get:
      tags:
      - Mutations
      summary: Get a single mutation proposal by ID
      parameters:
      - name: id
        in: path
        description: Mutation ID
        required: true
        schema:
          type: integer
          format: int32
      - name: Authorization
        in: header
        schema:
          type: string
      - name: lang
        in: header
        schema:
          type: string
      - name: APIKey
        in: header
        required: true
        schema:
          type: string
          default: 8fdfd2dffd-9mnvhu25d6c3d
      - name: SecretKey
        in: header
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_GameBall.BLL.ViewModels.LoyaltyAnalyzer.MutationProposalViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_GameBall.BLL.ViewModels.LoyaltyAnalyzer.MutationProposalViewModel'
            text/json:
