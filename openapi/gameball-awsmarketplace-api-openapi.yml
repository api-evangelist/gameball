openapi: 3.2.0
info:
  title: Gameball Aws Marketplace API
tags:
- name: AwsMarketplace
paths:
  /v1/aws-marketplace/fulfillment:
    post:
      tags:
      - AwsMarketplace
      summary: Where AWS Marketplace sends the buyer immediately after purchase.
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      - name: lang
        in: header
        schema:
          type: string
      - name: APIKey
        in: header
        required: true
        schema:
          type: string
          default: 8fdfd2dffd-9mnvhu25d6c3d
      - name: SecretKey
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                x-amzn-marketplace-token:
                  type: string
            encoding:
              x-amzn-marketplace-token:
                style: form
      responses:
        '200':
          description: OK
      operationId: postV1AwsMarketplaceFulfillment
      x-operation-id-source: derived
  /v1/aws-marketplace/registration:
    post:
      tags:
      - AwsMarketplace
      summary: Completes signup for a buyer who arrived from AWS Marketplace.
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      - name: lang
        in: header
        schema:
          type: string
      - name: APIKey
        in: header
        required: true
        schema:
          type: string
          default: 8fdfd2dffd-9mnvhu25d6c3d
      - name: SecretKey
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameBall.Admin.BLL.ViewModels.Registrations.AwsMarketplaceRegistrationViewModel'
          text/json:
            schema:
              $ref: '#/components/schemas/GameBall.Admin.BLL.ViewModels.Registrations.AwsMarketplaceRegistrationViewModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/GameBall.Admin.BLL.ViewModels.Registrations.AwsMarketplaceRegistrationViewModel'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_GameBall.Common.Connectors.Internal.Models.TokenViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_GameBall.Common.Connectors.Internal.Models.TokenViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/GameBall.Common.ProcessResult.ProcessResultViewModel_1_GameBall.Common.Connectors.Internal.Models.TokenViewModel'
      operationId: postV1AwsMarketplaceRegistration
      x-operation-id-source: derived
  /v1/aws-marketplace/events:
    post:
      tags:
      - AwsMarketplace
      summary: Where EventBridge delivers AWS Marketplace lifecycle notifications — upgrades…
      parameters:
      - name: Authorization
        in: header
        schema:
          type: string
      - name: lang
        in: header
        schema:
          type: string
      - name: APIKey
        in: header
        required: true
        schema:
          type: string
          default: 8fdfd2dffd-9mnvhu25d6c3d
      - name: SecretKey
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema: {}
          text/json:
            schema: {}
          application/*+json:
            schema: {}
      responses:
        '200':
          description: OK
      operationId: postV1AwsMarketplaceEvents
      x-operation-id-source: derived
