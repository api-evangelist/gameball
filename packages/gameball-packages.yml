currency_finding: >-
  Every first-party SERVER SDK is stale relative to the API it wraps. The
  current documented API is v4.0 (openapi/gameball-openapi.json, info.version
  4.0.0). The newest server SDK release on any package registry is the .NET
  package at 3.0.0 (2022-02-09); Node.js is at 0.1.7 (2020-09-30) and Python at
  1.0.0 (2020-08-25). No server SDK has shipped a release in over four years,
  and none carries a v4 major version. The MOBILE client SDKs are the opposite
  case — Flutter 3.2.1 shipped 2026-08-06 and React Native 3.1.2 shipped
  2026-04-08 — so the divergence is between the server integration SDKs and the
  in-app widget SDKs, not across the whole SDK program.
