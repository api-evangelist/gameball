rfc9457: false
rfc9457_detail: >-
  Gameball does not implement RFC 9457 Problem Details. No operation in the
  published specification declares an application/problem+json response; every
  declared response body is application/json carrying the Gameball error object
  (code / type / message / documentationUrl / requestId).
coverage_finding: >-
  This is the derived view of what the OPENAPI declares, and it is much thinner
  than what the DOCS publish. Across 78 operations the spec declares only 20
  error responses (7x400, 6x401, 4x404, 2x500, 1x422), concentrated on a handful
  of paths — 58 operations declare no failure response at all. Of the 20
  declared, 18 carry no schema, so a generator can produce no error type from
  them. Only two error bodies are typed: one $ref to components.schemas.Error
  and one inline object. The authoritative catalog of 60+ application error
  codes lives in the documentation, captured in errors/gameball-error-codes.yml.
