versioning:
  scheme: uri-path
  current: v4.1
  spec_version: v4.0
  detail: >-
    Major API version is pinned in the request path
    (https://api.gameball.co/api/{version}). v4.1 "Secure Integration Mode" is
    the current documented release (January 2025) and mandates BOTH APIKey and
    SecretKey on every /api/v4.1/integrations/... call, server-side only, with
    per-customer JWE session tokens for widget/mobile. v4.0 remains callable and
    is the ONLY version with a published OpenAPI. v3.x remains documented for
    existing SDK integrations.
  docs: https://docs.gameball.co/api-reference/introduction
  docs_v41: https://docs.gameball.co/api-reference/introduction-v4.1
  contract_lag:
    finding: >-
      The documented current version (v4.1) and the machine-readable contract
      (v4.0) have been out of step since January 2025. No v4.1 OpenAPI is
      served — /api-reference/openapi-v4.1.json and
      /api-reference/v4.1/openapi.json both return 404 — so a client generated
      from Gameball's published spec targets the superseded version and will
      miss v4.1's mandatory SecretKey requirement.
    checked: '2026-08-13'
  minimum_version_enforcement:
    supported: true
    detail: >-
      Merchants can set a minimum allowed API version from the Gameball
      dashboard, rejecting calls on older versions. This is a merchant-side
      control, not a Gameball-wide sunset — which means an integration can be
      switched off by the merchant without any deprecation notice from Gameball.
