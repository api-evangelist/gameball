aid: gameball
name: Gameball
description: Gameball is a customer loyalty and gamification platform that helps consumer brands turn
  one-time buyers into repeat customers through points, VIP tiers, referrals, cashback, coupons, reward
  campaigns and gamified experiences (spin the wheel, scratch & win, missions, stamps) plus email/SMS/push
  communication and automation campaigns. It exposes a RESTful API (base https://api.gameball.co/api/{version})
  secured with APIKey and SecretKey headers — v4.1 "Secure Integration Mode" is the documented current
  release, though the only OpenAPI Gameball publishes is v4.0. Alongside it are server SDKs for Node.js,
  Python, PHP, Ruby and .NET, actively-maintained mobile client SDKs for iOS, Android, Flutter and React
  Native, an embeddable web widget, signed webhooks, asynchronous batch ingestion, a test/live dual-key
  sandbox, an official OAuth-gated remote MCP server at https://mcp.gameball.co exposing 54 dashboard
  tools, a published A2A agent card and a provider-authored Agent Skill. Gameball is trusted by 3,000+
  brands across 70+ countries and is a 500 Global portfolio company.
