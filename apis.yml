aid: gameball
name: Gameball
description: >-
  Gameball is a customer loyalty and gamification platform that helps consumer
  brands turn one-time buyers into repeat customers through points, VIP tiers,
  referrals, cashback, coupons, reward campaigns and gamified experiences (spin
  the wheel, scratch & win, missions, stamps) plus email/SMS/push communication
  and automation campaigns. It exposes a RESTful API (base
  https://api.gameball.co/api/{version}, current v4.0) secured with APIKey and
  SecretKey headers, alongside server SDKs for Node.js, Python, PHP, Ruby and
  .NET, mobile/web client SDKs, signed webhooks, batch ingestion APIs and an
  official MCP server. Gameball is trusted by 3,000+ brands across 70+ countries
  and is a 500 Global portfolio company.
