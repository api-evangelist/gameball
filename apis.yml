apis:
- name: Gameball MCP Server
  description: >-
    Official remote Model Context Protocol server exposing 54 tools over the Gameball merchant/dashboard
    surface — customer lookup and points adjustment, tag management, earning configuration and custom
    earning rules, redemption options, reward-campaign authoring (event, date, calendar, game, mission),
    tier and program state, widget settings and localization, and analytics. OAuth 2.0 with PKCE and dynamic
    client registration; a single "mcp" scope covers the whole surface.
  humanURL: https://github.com/gameballers/gameball-mcp-codex
