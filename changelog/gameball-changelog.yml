api_entries:
  - version: v4.1
    date: '2025-01'
    label: January 2025
    title: Gameball API V4.1 — Secure Integration Mode
    tags: [API, Security]
    breaking: true
    url: https://docs.gameball.co/api-reference/introduction-v4.1
    breaking_changes:
      - >-
        Mandatory SecretKey: all endpoints under /api/v4.1/integrations/...
        require BOTH APIKey and SecretKey. Requests without SecretKey are
        rejected. This makes the previously optional "High Security Mode"
        behaviour mandatory.
      - >-
        Server-side only: integration endpoints can no longer be called from
        browsers or mobile apps directly. All calls must route through the
        integrator's backend.
    additions:
      - >-
        Minimum Version Enforcement — merchants can set a minimum allowed API
        version from the dashboard and reject older, less secure patterns.
      - >-
        Per-customer JWE session tokens for widget/mobile access, signed and
        encrypted with the account SecretKey, replacing direct client access.
    migration: >-
      v4.0 integrations must add SecretKey headers and move all calls
      server-side. Migration guide at
      https://docs.gameball.co/api-reference/introduction-v4.1
