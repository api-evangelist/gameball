finding: >-
  The Gameball MCP server and the Gameball v4.0 REST API are largely DISJOINT
  surfaces. The REST API is a server-to-server integration surface (orders,
  payments, transactions, coupons, batch ingestion, customer progress). The MCP
  server is an operator/dashboard surface (authoring campaigns, editing earning
  rules and redemption options, widget styling, analytics). Only about a third
  of the MCP tools have any public REST equivalent, and roughly four fifths of
  the REST operations have no tool at all — notably the entire transactions,
  orders, coupons and batch surface, which is the part an integration agent
  would most need.
