confidence_policy: >-
  high = tool name and REST operation describe the same resource and the same
  verb, and the REST operation exists in the public v4.0 spec. medium = same
  resource, differing shape (list vs single, or a config write the public spec
  exposes only partially). low = plausible semantic overlap only. Everything
  else is listed under mcp_only.
