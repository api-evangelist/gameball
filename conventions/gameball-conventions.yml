  - https://docs.gameball.co/api-reference/overview/status-error-codes
openapi: openapi/gameball-openapi.json
update_note: >-
  Pagination, expansion, localization and content-negotiation sections added
  2026-08-13, derived from the published OpenAPI
  (https://docs.gameball.co/api-reference/openapi.json) which was harvested in
  this round. Everything already in this file was searched from the docs and is
